<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyond the Flat</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Noto+Sans:wght@400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#262626;overflow:hidden;}
:root{--ink:0;}  /* 0=어두운 우주, 1=밝은 잉크 챕터 */
html.ink-on,html.ink-on body{background:color-mix(in srgb, #262626 calc((1 - var(--ink))*100%), #f0f2f5 calc(var(--ink)*100%));}
html.ink-on .const-star{fill:color-mix(in srgb, var(--cc,#fff) calc((1 - var(--ink))*100%), #262626 calc(var(--ink)*100%));}
#sky-svg{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;}

.const-line{transition:stroke-opacity 0.25s,stroke 0.25s;}
.const-star{transition:fill-opacity 0.25s,fill 0.25s,filter 0.25s;}
.const-label{transition:opacity 0.2s;pointer-events:none;-webkit-font-smoothing:antialiased;}

.constellation.hovered .const-line{stroke-opacity:0.7 !important;}
.constellation.hovered .const-star{fill-opacity:1 !important;}
.constellation.hovered .const-label{opacity:1 !important;}
.constellation.hovered-glow .const-star{filter:drop-shadow(0 0 5px var(--cc,#fff)) drop-shadow(0 0 12px var(--cc,#fff)) !important;}
.constellation.dimmed .const-line{stroke-opacity:0.05 !important;}
.constellation.dimmed .const-star{fill-opacity:0.1 !important;}
.constellation.season-active .const-line{stroke-opacity:0.6 !important;}
.constellation.season-active .const-star{fill-opacity:0.9 !important;}

#intro-title{position:fixed;top:36px;left:50%;transform:translateX(-50%);z-index:100;text-align:center;pointer-events:none;}
#intro-title h1{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:300;letter-spacing:0.4em;color:rgba(240,242,245,0.85);text-transform:uppercase;}
#intro-title p{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:300;color:rgba(240,242,245,0.5);margin-top:7px;letter-spacing:0.12em;font-style:normal;}

#season-bar{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:32px;align-items:center;}
.season-icon-btn{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;background:none;border:none;padding:0;opacity:0.45;transition:opacity 0.25s,transform 0.2s;}
.season-icon-btn:hover,.season-icon-btn.active{opacity:1;transform:scale(1.12);}
.season-icon-btn svg{width:32px;height:32px;display:block;}
.season-icon-btn span{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:400;letter-spacing:0.25em;text-transform:uppercase;}

    .sp-1 {
        fill: none;
        stroke: #92b900;
        stroke-miterlimit: 10;
      }
    .su-1, .su-2, .su-3 {
        fill: none;
        stroke: #f85d36;
        stroke-miterlimit: 10;
      }

      .su-2 {
        stroke-dasharray: 4.91 4.91;
      }

      .su-3 {
        stroke-dasharray: 2.02 2.02;
      }
    .fa-1 {
        fill: none;
        stroke: #ffb000;
        stroke-miterlimit: 10;
      }

      .fa-2 {
        fill: #ffb000;
      }
    .wi-1 {
        fill: none;
        stroke: #f0f2f5;
        stroke-miterlimit: 10;
      }

/* 반응형 */
*{box-sizing:border-box;}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;}
#sky-svg{position:fixed;top:0;left:0;width:100%;height:100%;}
@media(max-width:768px){
  #season-bar{gap:20px;bottom:30px;}
  .season-icon-btn svg{width:24px;height:24px;}
}

to{transform:translateX(0);opacity:1}}



/* Phase 4 */
@keyframes p4shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
</head>

<script>
(function(){
  // 부제(p)를 본제목(h1)의 좌우 너비에 맞게 크기 자동 조정
  function fitSubtitle(){
    var t=document.querySelector('#intro-title h1');
    var p=document.querySelector('#intro-title p');
    if(!t||!p) return;
    var target=t.getBoundingClientRect().width;
    if(!target) return;
    p.style.fontSize='15px';   // 고정 크기(제목 너비 자동맞춤 해제)
  }
  window.addEventListener('resize', fitSubtitle);
  window.addEventListener('load', fitSubtitle);
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(fitSubtitle); }
  fitSubtitle();
})();
</script>

<script>
const SEASON_COLORS = {spring:'#92b900',summer:'#f85d36',fall:'#ffb000',winter:'#f0f2f5'};
let activeSeason = null;

function hoverSeason(season) {
  if(typeof g1HoverReady!=='undefined' && g1HoverReady && season){ return; }
  activeSeason = season;
  ['spring','summer','fall','winter'].forEach(s => {
    document.getElementById('btn-'+s).classList.toggle('active', s===season);
  });
  document.querySelectorAll('.constellation').forEach(g => {
    const seas = JSON.parse(g.dataset.seasons || '[]');
    g.classList.remove('dimmed','season-active');
    if(season) {
      const active = seas.includes(season);
      g.classList.add(active ? 'season-active' : 'dimmed');
      const col = active ? SEASON_COLORS[season] : g.dataset.color;
      if(active) {
        g.querySelectorAll('.const-line').forEach(l => l.setAttribute('stroke', col));
        g.querySelectorAll('.const-star').forEach(c => c.setAttribute('fill', col));
        const lbl = g.querySelector('.const-label');
        if(lbl) lbl.setAttribute('fill', col);
      }
    } else {
      // 원래 색 복원
      const orig = g.dataset.color;
      g.querySelectorAll('.const-line').forEach(l => l.setAttribute('stroke', orig));
      g.querySelectorAll('.const-star').forEach(c => c.setAttribute('fill', orig));
      const lbl = g.querySelector('.const-label');
      if(lbl) lbl.setAttribute('fill', orig);
    }
  });
}

// 별자리 hover
document.querySelectorAll('.constellation').forEach(g => {
  g.style.setProperty('--cc', g.dataset.color||'#ffffff');
  g.addEventListener('mouseenter', () => {
    g.classList.add('hovered');
    if(!g1HoverReady) g.classList.add('hovered-glow');
  });
  g.addEventListener('mouseleave', () => { g.classList.remove('hovered'); g.classList.remove('hovered-glow'); });
});

    stars.forEach(s=>{mnx=Math.min(mnx,s.cx);mxx=Math.max(mxx,s.cx);mny=Math.min(mny,s.cy);mxy=Math.max(mxy,s.cy);});

  function proj(s){

function getSVGScaleAndOffset() {
  const W = window.innerWidth, H = window.innerHeight;
  const s = Math.min(W/1960, H/980);
  return { s, ox: (W-1960*s)/2, oy: (H-980*s)/2 };
}

function svgToScreen(bx, by) {
  const {s, ox, oy} = getSVGScaleAndOffset();
  return [ox + bx*s, oy + by*s];
}

// ── 오프닝: 별자리 선을 스크롤 진행도(p:0숨김~1완성)에 따라 그려넣기 ──
function drawHomeLines(p){
  document.querySelectorAll('.constellation .const-line').forEach(l=>{
    if(l.__hlen==null){
      const pts=(l.getAttribute('points')||'').trim().split(/\s+/).map(s=>s.split(',').map(Number)).filter(a=>a.length===2);
      let len=0; for(let i=1;i<pts.length;i++) len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
      l.__hlen=len||1;
    }
    l.style.transition='none';
    l.style.strokeDasharray=l.__hlen;
    l.style.strokeDashoffset=l.__hlen*(1-p);
    l.style.opacity = p>0.001 ? '1' : '0';
  });
}
function clearHomeLines(){
  document.querySelectorAll('.constellation .const-line').forEach(l=>{
    l.style.strokeDasharray=''; l.style.strokeDashoffset=''; l.style.opacity='';

  set('cap-graph1',  t>1.6 && t<2.3);                  // 그래프1 등장
  set('cap-g1hint',  t>1.6 && t<2.3);                  // 그래프1: 별 클릭 안내
  set('cap-graph2',  t>3.3 && t<4.05);                 // 그래프2 완성
  set('cap-sirius',  !!window._p4BRev && t>4.6 && t<5.3);// 시리우스 쌍성 — 박스(줌)와 같은 시점에 사라지게

function applyScroll(t) {

    Building.apply(bldP);

    return;
  }
  bldLocked = false;   // 영역뷰 이하로 내려오면 잠금 해제 → 스크롤 정상 동작

  if(t > 9) {

  }

    applyPhase4(1);
    applyOrbit(1);

  }

  if(t > 5) {
    applyPhase4(1);
    applyOrbit(t - 5);

  }

    const _sb3 = document.getElementById('season-bar');
    const _ti3 = document.getElementById('intro-title');
    if(_sb3){ _sb3.style.opacity='0'; _sb3.style.pointerEvents='none'; }

// ── Phase 2: 줌아웃 → 전체 거리 그래프 ──
function applyPhase2(t2) {
  const W = window.innerWidth, H = window.innerHeight;
  const {s: baseS} = getSVGScaleAndOffset();
  const [cmSx, cmSy] = svgToScreen(CM_CX, CM_CY);

  // t2: 0~0.5 = 줌아웃 / 0.5~1 = 거리 그래프
  const zoomOutT = Math.min(1, t2 * 2);
  const graphT   = Math.max(0, t2 * 2 - 1);
  const zoomOutE = easeIO(zoomOutT);
  const graphE   = easeIO(graphT);
  const _g1ready = graphE > 0.85;
  if(g1HoverReady && !_g1ready) clearG1Hover();   // 그래프1에서 벗어날 때만 정리(호버 유지)
  g1HoverReady = _g1ready; g1BarShow(_g1ready);

  // ── 줌아웃 ──
  const zoomScale = 9 - zoomOutE * 8; // 9→1
  const offsetX = (W/2 - cmSx) * (1 - zoomOutE);
  const offsetY = (H/2 - cmSy) * (1 - zoomOutE);
  const svgEl = document.getElementById('sky-svg');
  svgEl.style.transformOrigin = cmSx + 'px ' + cmSy + 'px';
  svgEl.style.transform = `translate(${offsetX}px,${offsetY}px) scale(${zoomScale})`;

  // 다른 별자리 등장
  document.querySelectorAll('.constellation:not(#const-canis-minor)').forEach(g => {
    g.style.opacity = String(zoomOutE);
  });

  // 연결선·레이블 페이드아웃 (graphT 기준)
  document.querySelectorAll('.const-line, .const-label').forEach(el => {
    el.style.opacity = String(Math.max(0, 1 - graphE * 3));
  });

  // ── 거리 그래프: 모든 별 Y축 이동 ──
  const DIST_MIN = 9, DIST_MAX = 3200;
  function distToScreenY(d) {
    const ratio = (Math.log(d) - Math.log(DIST_MIN)) / (Math.log(DIST_MAX) - Math.log(DIST_MIN));
    return H * 0.85 - ratio * H * 0.75;
  }

  // 현재 zoom 기준으로 화면 Y 계산
  function circleScreenY(origCx, origCy) {
    const [sx, sy] = svgToScreen(origCx, origCy);
    return cmSy + (sy - cmSy) * zoomScale + offsetY;
  }

  // Canis Minor: phase1 상태 먼저 적용 (cy 유지)
  const constG = document.getElementById('const-canis-minor');
  if(constG) {
    // phase1 끝 상태의 cy 값을 data-phase1cy에 저장 (첫 진입 시)
    constG.querySelectorAll('.const-star').forEach(circ => {
      const origCy = parseFloat(circ.dataset.baseOrigCy||circ.dataset.origCy||circ.getAttribute('cy'));
      const origCx = parseFloat(circ.getAttribute('cx'));
      const isGomeisa = Math.abs(origCx - GOMEISA.cx) < 1;
      const procyonDownPixels = H * 0.08;
      const movePixels = H * 0.38;
      const GRAPH_OFFSET_SVG = 30 / (baseS * zoomScale);

      // phase1 끝 상태의 cy
      const p1u = isGomeisa
        ? movePixels / (baseS * 9)
        : procyonDownPixels / (baseS * 9);
      const p1CY = origCy + (isGomeisa ? -1 : 1) * p1u + 30 / (baseS * 9);

      if(graphE < 0.01) {
        circ.setAttribute('cy', String(p1CY));
      } else {
        const dist = isGomeisa ? GOMEISA.dist : PROCYON.dist;
        const targetScreenY = distToScreenY(dist);
        const p1ScreenY = cmSy + (svgToScreen(origCx, p1CY)[1] - cmSy) * zoomScale + offsetY;
        const deltaScreenY = targetScreenY - p1ScreenY;
        const deltaSVG = deltaScreenY / (baseS * zoomScale);
        circ.setAttribute('cy', String(p1CY + deltaSVG * graphE));
      }
    });

    const line = constG.querySelector('polyline');
    if(line && line.dataset.origPts) {
      const stars2 = constG.querySelectorAll('.const-star');
      const cyMap = {};
      stars2.forEach(circ => {
        cyMap[parseFloat(circ.getAttribute('cx')).toFixed(1)] = parseFloat(circ.getAttribute('cy'));
      });
      const pts = line.dataset.origPts.split(' ').map(p => p.split(',').map(Number));
      line.setAttribute('points', pts.map(([px,py]) => {
        const key = px.toFixed(1);
        return [px, cyMap[key] !== undefined ? cyMap[key] : py];
      }).map(p=>p.join(',')).join(' '));
    }
  }

  // 다른 별자리
  document.querySelectorAll('.constellation:not(#const-canis-minor)').forEach(g => {
    const cid2 = g.dataset.id;
    const distData = STAR_DIST_MAP[cid2] || {};
    g.querySelectorAll('.const-star').forEach(circ => {
      const origCy = parseFloat(circ.dataset.baseOrigCy||circ.dataset.origCy||circ.getAttribute('cy'));
      const origCx = parseFloat(circ.getAttribute('cx'));
      if(graphE < 0.01) {
        circ.setAttribute('cy', String(origCy));
        return;
      }
      const dist = distData[origCx.toFixed(1)] || 500;
      const targetScreenY = distToScreenY(dist);
      const curScreenY = circleScreenY(origCx, origCy);
      const deltaScreenY = targetScreenY - curScreenY;
      const deltaSVG = deltaScreenY / (baseS * zoomScale);
      circ.setAttribute('cy', String(origCy + deltaSVG * graphE));
    });
  });

  // ── 오버레이: Y축 ──
  oSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  oSvg.innerHTML = '';
  if(graphE < 0.01) return;

  function mk(tag){ return document.createElementNS('http://www.w3.org/2000/svg',tag); }
  const a = graphE;
  const yX = 45;

  const yLine = mk('line');
  yLine.setAttribute('x1',yX); yLine.setAttribute('x2',yX);
  yLine.setAttribute('y1',H*0.08); yLine.setAttribute('y2',H*0.88);
  yLine.setAttribute('stroke',`rgba(240,242,245,${a*0.2})`);
  yLine.setAttribute('stroke-width','1');
  oSvg.appendChild(yLine);

  [10,25,50,100,200,500,1000,2000,3200].forEach(d => {
    const ty = distToScreenY(d);
    if(ty < H*0.06 || ty > H*0.9) return;
    const tick = mk('line');
    tick.setAttribute('x1',yX-4); tick.setAttribute('x2',yX);
    tick.setAttribute('y1',ty); tick.setAttribute('y2',ty);
    tick.setAttribute('stroke',`rgba(240,242,245,${a*0.25})`);
    tick.setAttribute('stroke-width','1');
    oSvg.appendChild(tick);
    const lbl = mk('text');
    lbl.setAttribute('x',yX-7); lbl.setAttribute('y',ty+4);
    lbl.setAttribute('text-anchor','end');
    lbl.setAttribute('font-family','Montserrat,sans-serif');
    lbl.setAttribute('font-size','13'); lbl.setAttribute('font-weight','300');
    lbl.setAttribute('fill',`rgba(240,242,245,${a*0.4})`);
    lbl.textContent = d>=1000?(d/1000).toFixed(d%1000?1:0)+'k ly':d+' ly';
    oSvg.appendChild(lbl);
    const hLine = mk('line');
    hLine.setAttribute('x1',yX); hLine.setAttribute('x2',W);
    hLine.setAttribute('y1',ty); hLine.setAttribute('y2',ty);
    hLine.setAttribute('stroke',`rgba(240,242,245,${a*0.04})`);
    hLine.setAttribute('stroke-width','1');
    hLine.setAttribute('stroke-dasharray','3 8');
    oSvg.appendChild(hLine);
  });

  const yLbl = mk('text');
  yLbl.setAttribute('x',yX+6); yLbl.setAttribute('y',H*0.07);
  yLbl.setAttribute('text-anchor','start');
  yLbl.setAttribute('font-family','Montserrat,sans-serif');
  yLbl.setAttribute('font-size','13'); yLbl.setAttribute('font-weight','300');
  yLbl.setAttribute('fill',`rgba(240,242,245,${a*0.35})`);
  yLbl.textContent='distance (ly)';
  oSvg.appendChild(yLbl);
}

// ── Phase 3: sort.svg + 물리 + 그래프 ──
const SORT_W=1921.7,SORT_H=1823.16,HIST_BINS=20;
// 깔때기 바닥과 히스토그램 사이 간격(H 배수). 키우면 깔때기가 위로 더 빠져 바닥 끝이 화면 위에서 안 보임(히스토그램 위치는 고정, 낙하거리만 자동 재계산)
const P3_FUNNEL_GAP=1.15;
const BIN_EDGES=[9, 12, 16, 22, 29, 39, 52, 70, 94, 127, 170, 228, 305, 410, 549, 737, 988, 1326, 1779, 2386, 3200]; // 로그 스케일 경계
const FLUT=[0,0.15,0.61,1.39,2.5,3.95,5.76,7.93,10.49,13.43,16.79,20.56,24.77,29.44,34.57,40.19,46.3,52.94,60.11,67.83,76.12,85,94.49,104.59,115.32,126.7,138.73,151.43,164.81,178.85,193.57,208.95,224.98,241.65,258.92,276.76,295.14,314.01,333.31,352.97,372.94,393.13,413.47,433.88,454.28,474.6,494.74,514.66,534.27,553.51,572.35,590.72,608.58,625.92,642.7,658.9,674.51,689.52,703.93,717.74,730.94,743.56,755.59,767.05,777.95,788.29,798.1,807.38,816.16,824.44,832.24,839.58,846.46,852.91,858.93,864.54,869.76,874.59,879.05,883.14,886.89,890.3,893.39,896.15,898.61,900.77,902.64,904.23,905.55,906.61,907.41,907.96,908.27,908.35,908.17,907.72,907,905.98,904.67,903.05,901.1,898.83,896.2,893.22,889.87,886.13,882,877.45,872.47,867.05,861.17,854.82,847.97,840.62,832.74,824.33,815.36,805.83,795.72,785.02,773.72,761.82,749.31,736.2,722.48,708.17,693.29,677.85,661.88,645.41,628.49,611.16,593.47,575.48,557.25,538.85,520.34,501.78,483.25,464.8,446.5,428.4,410.56,393.01,375.81,358.98,342.55,326.54,310.98,295.88,281.24,267.07,253.37,240.15,227.4,215.12,203.29,191.92,180.99,170.5,160.43,150.77,141.52,132.67,124.19,116.09,108.35,100.96,93.91,87.19,80.79,74.7,68.91,63.42,58.21,53.27,48.61,44.2,40.04,36.13,32.46,29.02,25.8,22.8,20.01,17.43,15.04,12.85,10.86,9.04,7.41,5.95,4.66,3.54,2.58,1.78,1.13,0.63,0.28,0.07,0];
function funnelLeftX(fy){
  if(fy<=0)return 0; if(fy>=SORT_H)return 0;
  const ti=fy/SORT_H*200,i=Math.min(199,Math.floor(ti)),f=ti-i;
  return FLUT[i]*(1-f)+FLUT[i+1]*f;
}
function funnelRightX(fy){return SORT_W-funnelLeftX(fy);}
function distToBin(dist){
  for(let i=0;i<HIST_BINS;i++)if(dist<BIN_EDGES[i+1])return i;
  return HIST_BINS-1;
}

let p3Physics=null,p3AnimId=null,p3Active=false,p3active_render=false,p3Settled=false;
let p3Frames=0,p3Cache=null,p3RecDone=false,_p3seed=0;
function p3rng(){ _p3seed=(_p3seed+0x6D2B79F5)|0; let t=Math.imul(_p3seed^(_p3seed>>>15),1|_p3seed); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }
let p3SlideY=0,p3FunnelY=0,physFrame=0,p3WorldY=0;

function initPhysics(){
  if(p3Physics)return;
  _p3seed=1337;
  const W=window.innerWidth,H=window.innerHeight,fS=W/SORT_W;
  const SLOT=7;
  const hBase=p3FunnelY+SORT_H*fS+H*P3_FUNNEL_GAP;
  document.getElementById('sky-svg').style.display='none';
  const stars=[];let idx=0;
  const baseS=getSVGScaleAndOffset().s;
  document.querySelectorAll('.constellation').forEach(g=>{
    const cid=g.dataset.id,col=g.dataset.color,dd=STAR_DIST_MAP[cid]||{};
    g.querySelectorAll('.const-star').forEach(circ=>{
      const cx=parseFloat(circ.getAttribute('cx'));
      const svgR=parseFloat(circ.getAttribute('r'))||2.5;
      const dist=dd[cx.toFixed(1)]||300;
      const [sx]=svgToScreen(cx,0);
      const ratio=(Math.log(dist)-Math.log(9))/(Math.log(3200)-Math.log(9));
      const baseY=H*0.85-ratio*H*0.75+p3SlideY;
      const delay=Math.floor(p3rng()*55);
      stars.push({x:sx, y:baseY,
        vx:0, vy:0, r:3, drawR:Math.max(1.6, svgR*baseS), dist,col,
        bin:distToBin(dist),settled:false,
        omega:(p3rng()-0.5)*0.3,delay});
      idx++;
    });
  });
  p3Physics={stars,binStacks:new Array(HIST_BINS).fill(0),fS,hBase,SLOT};
}
// 물리 시뮬을 한 번 끝까지 돌려 각 별의 프레임별 위치 기록(녹화)
function recordPhysics(){
  const ss=p3Physics.stars, MAXF=800, traj=ss.map(()=>[]);
  let f=0;
  for(; f<MAXF; f++){
    for(let k=0;k<ss.length;k++){ traj[k].push(ss[k].x, ss[k].y); }
    if(ss.every(s=>s.settled)) break;
    stepPhysics();
  }
  for(let k=0;k<ss.length;k++){ traj[k].push(ss[k].x, ss[k].y); ss[k].trajArr=new Float32Array(traj[k]); }
  p3Frames=f+1; p3RecDone=true;
}
// 물리 준비(캐시 재사용 또는 신규 녹화)
function ensureP3(){
  if(p3Physics) return;
  if(p3Cache && p3Cache.W===window.innerWidth && p3Cache.H===window.innerHeight){
    p3Physics={stars:p3Cache.stars,binStacks:[],fS:p3Cache.fS,hBase:p3Cache.hBase,SLOT:p3Cache.SLOT};
    p3Frames=p3Cache.frames; p3RecDone=true; p3Active=true; return;
  }
  initPhysics(); p3Active=true; recordPhysics();
  p3Cache={stars:p3Physics.stars,fS:p3Physics.fS,hBase:p3Physics.hBase,SLOT:p3Physics.SLOT,W:window.innerWidth,H:window.innerHeight,frames:p3Frames};
}

function stepPhysics(){
  if(!p3Physics)return;
  const W=window.innerWidth;
  const {stars,binStacks,fS,hBase,SLOT}=p3Physics;
  const G=0.6,B=0.55,FR=0.85,HL=W*0.06,BW=(W*0.88)/HIST_BINS;
  physFrame++;
  stars.forEach(s=>{
    if(s.settled||physFrame<s.delay)return;
    s.omega*=0.92; s.vy+=G; s.x+=s.vx; s.y+=s.vy;
    const fy=(s.y-p3FunnelY)/fS;
    if(fy>=-1&&fy<SORT_H){
      const lw=funnelLeftX(Math.max(0,fy))*fS,rw=funnelRightX(Math.max(0,fy))*fS;
      if(s.x-s.r<lw){
        s.x=lw+s.r+0.5;
        const eps=2,dldy=(funnelLeftX(fy+eps)-funnelLeftX(fy-eps))*fS/(eps*2);
        const mag=Math.sqrt(1+dldy*dldy),nx=1/mag,ny=-dldy/mag,dot=s.vx*nx+s.vy*ny;
        if(dot<0){s.vx=(s.vx-2*dot*nx)*B;s.vy=(s.vy-2*dot*ny)*B;s.vx+=nx*0.5;}
        s.omega+=0.4;
      }
      if(s.x+s.r>rw){
        s.x=rw-s.r-0.5;
        const eps=2,drdy=-(funnelRightX(fy+eps)-funnelRightX(fy-eps))*fS/(eps*2);
        const mag=Math.sqrt(1+drdy*drdy),nx=-1/mag,ny=-drdy/mag,dot=s.vx*nx+s.vy*ny;
        if(dot<0){s.vx=(s.vx-2*dot*nx)*B;s.vy=(s.vy-2*dot*ny)*B;s.vx+=nx*0.5;}
        s.omega-=0.4;
      }
    }
    if(s.y>p3FunnelY+SORT_H*fS){
      const tx=HL+s.bin*BW+BW/2;
      s.vx+=(tx-s.x)*0.09; s.vx*=0.78;                          // 자기 칸으로 빠르게 정렬
      const sn=binStacks[s.bin],sy2=hBase-sn*(SLOT*2+1)-SLOT;   // 현재 스택 꼭대기
      if(s.y+s.r>=sy2){                                         // 스택 꼭대기에 닿음 → 떨어지던 그 위에 안착
        if(Math.abs(s.x-tx)<BW*0.6){
          binStacks[s.bin]++; s.settled=true;
          s.x=tx; s.y=sy2; s.vx=s.vy=s.omega=0;
        } else {                                                // 아직 칸 밖이면 바닥까지 안 떨어지게 꼭대기서 붙잡고 정렬
          s.y=sy2-s.r; if(s.vy>0)s.vy*=0.4;
        }
      }
    }
    if(s.x-s.r<0){s.x=s.r;s.vx=Math.abs(s.vx)*B;}
    if(s.x+s.r>W){s.x=W-s.r;s.vx=-Math.abs(s.vx)*B;}
  });
}

function drawScene(){
  if(!p3Physics)return;
  const W=window.innerWidth,H=window.innerHeight;
  const {stars,fS,hBase,SLOT}=p3Physics;
  const wy=p3WorldY;
  const HLg=W*0.06, BWg=(W*0.88)/HIST_BINS;

  oSvg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  oSvg.innerHTML='';
  const mk=t=>document.createElementNS('http://www.w3.org/2000/svg',t);

  // sort.svg
  const fy0=p3FunnelY-wy;
  const fg=mk('g');
  fg.setAttribute('transform',`translate(0,${fy0}) scale(${fS})`);
  fg.setAttribute('opacity',String(Math.max(0,1-p4E*2)));   // 시리우스 줌 시 퍼널도 페이드아웃(모서리 삐짐 방지)
  const st=mk('style');st.textContent='.sort-cls-1{fill:#f0f2f5;}';fg.appendChild(st);
  const pg=mk('g');pg.innerHTML="<g id=\"Layer_1-2\" data-name=\"Layer 1\"> <g> <path class=\"sort-cls-1\" d=\"M0,0c0,410.06,907.17,377.09,908.35,845.34C909.47,1287.44,0,1215.51,0,1823.16V0Z\"/> <path class=\"sort-cls-1\" d=\"M1921.7,0c0,410.06-907.17,377.09-908.35,845.34-1.12,442.1,908.35,370.17,908.35,977.82V0Z\"/> </g> </g>";fg.appendChild(pg);
  oSvg.appendChild(fg);

  // 별
  stars.forEach(s=>{
    if(physFrame<s.delay)return;
    let _syR=s.y;
    if(g2HoverP>0.01 && g2HoverBin>=0 && s.settled && Math.floor((s.x-HLg)/BWg)===g2HoverBin){
      const k=Math.round((hBase-SLOT-s.y)/(SLOT*2+1));      // 스택 내 순위(0=바닥)
      _syR=hBase-SLOT-k*(SLOT*2+1)*(1-0.6*g2HoverP);          // 간격 줄여 아래로 압축
    }
    const sy=_syR-wy;
    const isSirius=(s.dist===9);
    let starAlpha=isSirius?1:Math.max(0,1-p4E*1.5);
    if(s._fadeAlpha!==undefined) starAlpha=s._fadeAlpha;
    if(s.isSiriusB&&s._fadeAlpha!==undefined) starAlpha=s._fadeAlpha;
    if(starAlpha<0.01) return;
    let dR=(s.drawR||s.r);
    if(isSirius) dR = dR*(1-p4E) + s.r*p4E;   // 시리우스: 줌인 완료 시 궤도와 같은 고정 크기로 수렴(화면 크기 무관)
    const gw=mk('circle');gw.setAttribute('cx',s.x);gw.setAttribute('cy',sy);
    gw.setAttribute('r',dR*2.2);gw.setAttribute('fill',s.col+'18');
    gw.setAttribute('opacity',String(starAlpha));oSvg.appendChild(gw);
    const dot=mk('circle');dot.setAttribute('cx',s.x);dot.setAttribute('cy',sy);
    dot.setAttribute('r',dR);dot.setAttribute('fill',s.col+'ee');
    dot.setAttribute('opacity',String(starAlpha));oSvg.appendChild(dot);
  });

  // X축 및 레이블
  const HL=W*0.06,BW=(W*0.88)/HIST_BINS;
  const axisY=hBase+SLOT+14-wy;
  const axisAlpha=Math.max(0,1-p4E*2);
  const xl=mk('line');
  xl.setAttribute('x1',HL-4);xl.setAttribute('x2',W*0.94+4);
  xl.setAttribute('y1',axisY);xl.setAttribute('y2',axisY);
  xl.setAttribute('stroke',`rgba(240,242,245,${0.3*axisAlpha})`);xl.setAttribute('stroke-width','1');
  oSvg.appendChild(xl);

  // 구간별 별 개수 집계 (밝기 표시용)
  const counts=new Array(HIST_BINS).fill(0);
  stars.forEach(s=>{ if(physFrame<s.delay) return; const bi=Math.floor((s.x-HL)/BW); if(bi>=0&&bi<HIST_BINS) counts[bi]++; });
  const maxC=Math.max(1,Math.max.apply(null,counts));

  // 가장자리 눈금 + 거리 라벨 (모든 구간)
  for(let i=0;i<=HIST_BINS;i++){
    const lx=HL+i*BW;
    const tk=mk('line');tk.setAttribute('x1',lx);tk.setAttribute('x2',lx);
    tk.setAttribute('y1',axisY);tk.setAttribute('y2',axisY+4);
    tk.setAttribute('stroke','rgba(240,242,245,'+(0.25*axisAlpha)+')');tk.setAttribute('stroke-width','1');
    oSvg.appendChild(tk);
    const lb=mk('text');lb.setAttribute('x',lx);lb.setAttribute('y',axisY+15);
    lb.setAttribute('text-anchor','middle');lb.setAttribute('font-family','Montserrat,sans-serif');
    lb.setAttribute('font-size','13');lb.setAttribute('font-weight','300');
    lb.setAttribute('fill',`rgba(240,242,245,${0.45*axisAlpha})`);
    const val=BIN_EDGES[i];
    lb.textContent=val>=1000?(val/1000).toFixed(1)+'k':val+'ly';
    oSvg.appendChild(lb);
  }

  // 구간별 별 개수 → 밝기 표시 (축선 위 6px, 숫자·별과 안 겹치는 빈 영역). 많을수록 밝게, 개수 경계로 단계별
  for(let i=0;i<HIST_BINS;i++){
    const c=counts[i]; if(c<=0) continue;
    const ratio=c/maxC;
    const lvl = ratio<0.2?0.22 : ratio<0.4?0.42 : ratio<0.6?0.62 : ratio<0.8?0.82 : 1.0;
    const cxc=HL+(i+0.5)*BW;
    const seg=mk('line');
    seg.setAttribute('x1',cxc-BW*0.32);seg.setAttribute('x2',cxc+BW*0.32);
    seg.setAttribute('y1',axisY-6);seg.setAttribute('y2',axisY-6);
    seg.setAttribute('stroke','#f0f2f5');seg.setAttribute('stroke-width',i===g2HoverBin?'5':'3');seg.setAttribute('stroke-linecap','round');
    seg.setAttribute('opacity',String((i===g2HoverBin?1:lvl)*axisAlpha));
    oSvg.appendChild(seg);
  }

  // 색깔바 호버: 그 구간 별 개수 숫자 (압축된 스택 위에 등장)
  if(g2HoverBin>=0 && g2HoverP>0.01 && axisAlpha>0.01){
    const c=counts[g2HoverBin]||0;
    const cxc=HL+(g2HoverBin+0.5)*BW;
    const topY=hBase-SLOT-Math.max(0,c-1)*(SLOT*2+1)*(1-0.6*g2HoverP)-wy;
    const t=mk('text');t.setAttribute('x',cxc);t.setAttribute('y',topY-16);
    t.setAttribute('text-anchor','middle');t.setAttribute('font-family','Montserrat,sans-serif');
    t.setAttribute('font-size','15');t.setAttribute('font-weight','700');
    t.setAttribute('fill','#f0f2f5');t.setAttribute('opacity',String(g2HoverP*axisAlpha));
    t.textContent=c;
    oSvg.appendChild(t);
  }
}

// 그래프2 하단 색깔바 호버: 구간 별 개수 + 아래로 압축
let g2HoverBin=-1, g2HoverP=0, g2HoverRAF=null;
function g2HoverLoop(){
  const target=g2HoverBin>=0?1:0;
  g2HoverP+=(target-g2HoverP)*0.28;
  if(Math.abs(target-g2HoverP)<0.012){ g2HoverP=target; if(p3Physics)drawScene(); g2HoverRAF=null; return; }
  if(p3Physics)drawScene();
  g2HoverRAF=requestAnimationFrame(g2HoverLoop);
}
function g2SetHover(b){ if(b===g2HoverBin)return; g2HoverBin=b; if(!g2HoverRAF)g2HoverRAF=requestAnimationFrame(g2HoverLoop); }
window.addEventListener('mousemove',e=>{
  if(!p3Physics){ if(g2HoverBin>=0)g2SetHover(-1); return; }
  const stars=p3Physics.stars; let st=0;
  for(let k=0;k<stars.length;k++) if(stars[k].settled) st++;
  if(st < stars.length*0.85){ if(g2HoverBin>=0)g2SetHover(-1); return; }   // 대부분 정착했을 때만
  const W=window.innerWidth; const hBase=p3Physics.hBase,SLOT=p3Physics.SLOT,wy=p3WorldY;
  const HL=W*0.06, BW=(W*0.88)/HIST_BINS; const axisY=hBase+SLOT+14-wy;
  const x=e.clientX, y=e.clientY;
  if(y>=axisY-18 && y<=axisY+24 && x>=HL && x<=HL+HIST_BINS*BW)
    g2SetHover(Math.min(HIST_BINS-1,Math.max(0,Math.floor((x-HL)/BW))));
  else g2SetHover(-1);
});

function resetPhase3(){
  if(p3AnimId){cancelAnimationFrame(p3AnimId);p3AnimId=null;}
  p3Physics=null;p3Active=false;p3active_render=false;physFrame=0;p3WorldY=0;p3Settled=false;p3RecDone=false;
  oSvg.innerHTML='';
  oSvg.style.transform='';
  oSvg.style.opacity='';
  const sv=document.getElementById('sky-svg');
  sv.style.display='';sv.style.transform='';
}

function applyPhase3(t3){
  const W=window.innerWidth,H=window.innerHeight,fS=W/SORT_W;

  // phase3a: sky-svg 위로, sort 등장
  const sE=easeIO(Math.min(1,t3*3));
  p3SlideY=-sE*H*0.62;
  p3FunnelY=H*(1-sE)+H*0.02*sE;
  const sv=document.getElementById('sky-svg');
  if(sv.style.display!=='none'){
    sv.style.transform=`translateY(${p3SlideY}px)`;
    sv.style.transformOrigin='50% 50%';
  }
  if(sE>=0.999&&!p3Physics) ensureP3();

  // phase3b: p3WorldY 업데이트 (renderLoop이 알아서 drawScene 호출)
  if(p3Physics){
    // X축 레이블(axisY = hBase+SLOT+14)이 화면 88% 지점 + P3_AXIS_DOWN px 아래에 오면 멈춤
    const targetAxisScreenY=H*0.88+P3_AXIS_DOWN;
    const maxWY=Math.max(0,p3Physics.hBase+p3Physics.SLOT+14-targetAxisScreenY);
    // 별이 떨어지는 진행도(낙하 재생과 동일)에 맞춰 카메라가 함께 아래로 내려감
    const camProg=Math.max(0,Math.min(1,(t3-0.34)/1.06));
    p3WorldY=easeIO(camProg)*maxWY;
  } else {
    p3WorldY=0;
  }

  // 녹화 재생 (스크롤 위치 기반 — 앞으로=떨어져 쌓임, 뒤로=떠올라 흩어짐)
  if(p3Physics && p3RecDone){
    const _sv=document.getElementById('sky-svg'); if(_sv && _sv.style.display!=='none') _sv.style.display='none';
    const prog=Math.max(0,Math.min(1,(t3-0.34)/1.06));
    const frame=Math.round(prog*(p3Frames-1));
    physFrame=frame;
    const ss=p3Physics.stars;
    for(let k=0;k<ss.length;k++){ const a=ss[k].trajArr,i=frame*2; ss[k].x=a[i]; ss[k].y=a[i+1]; }
    drawScene();
  } else if(!p3Physics){
    oSvg.setAttribute('viewBox',`0 0 ${W} ${H}`);oSvg.innerHTML='';
    const mk=t=>document.createElementNS('http://www.w3.org/2000/svg',t);
    const fg=mk('g');fg.setAttribute('transform',`translate(0,${p3FunnelY}) scale(${fS})`);
    const st=mk('style');st.textContent='.sort-cls-1{fill:#f0f2f5;}';fg.appendChild(st);
    const pg=mk('g');pg.innerHTML="<g id=\"Layer_1-2\" data-name=\"Layer 1\"> <g> <path class=\"sort-cls-1\" d=\"M0,0c0,410.06,907.17,377.09,908.35,845.34C909.47,1287.44,0,1215.51,0,1823.16V0Z\"/> <path class=\"sort-cls-1\" d=\"M1921.7,0c0,410.06-907.17,377.09-908.35,845.34-1.12,442.1,908.35,370.17,908.35,977.82V0Z\"/> </g> </g>";fg.appendChild(pg);oSvg.appendChild(fg);
  }
}


// ── Phase 4: 시리우스 줌인 ──
const SIRIUS_CX=1386.4, SIRIUS_CY=673.6, SIRIUS_R_SVG=8.2;
// 그래프2 X축이 화면 88% 지점에서 아래로 얼마나 더 내려가는지 (카메라 = 시리우스 박스 위치 공유)
const P3_AXIS_DOWN=65;
let p4E=0;
let p4Wrong=0, p4Done=false, p4Built=false;

function buildP4UI(cx, cy, r){

  // 버튼

  document.body.appendChild(btns);

function onP4Btn(val, cx, cy, bx, by, boxSize){
  if(p4Done) return;
  const rect=document.getElementById('p4rect');
  if(!rect) return;

  if(val===2){
    p4Done=true;
    rect.setAttribute('stroke','rgba(100,240,130,0.85)');
    setTimeout(()=>showQmark(cx,cy,bx,by,boxSize),400);
  } else {
    p4Wrong++;
    rect.setAttribute('stroke','rgba(240,80,80,0.85)');
    const ui=document.getElementById('p4-ui');
    if(ui){ ui.style.animation='none'; void ui.offsetWidth; ui.style.animation='p4shake 0.4s'; }
    setTimeout(()=>{
      rect.setAttribute('stroke','rgba(240,242,245,0.55)');
      const ui2=document.getElementById('p4-ui');
      if(ui2) ui2.style.animation='';
    },450);
    if(p4Wrong>=2){
      p4Done=true;
      setTimeout(()=>showQmark(cx,cy,bx,by,boxSize),500);
    }
  }
}

function showQmark(cx, cy, bx, by, boxSize){
  const svg=document.getElementById('p4svg');
  if(!svg) return;
  const qx=cx, qy=by+boxSize*0.25;
  const q=document.createElementNS('http://www.w3.org/2000/svg','text');

let p4ClickCount=0;
let p4SiriusEl=null;

function activateSiriusClick(){
  const ui=document.getElementById('p4-ui');
  if(ui){ const q=ui.querySelector('div'); if(q) q.textContent='Click on the star'; }
  const btns=document.getElementById('p4-btns');

function onSiriusClick(){
  p4ClickCount++;
  shakeSirius();
  if(p4ClickCount>=3){
    const hit=document.getElementById('p4-hit');
    if(hit) hit.style.pointerEvents='none';
    setTimeout(revealSiriusB, 600);
  }
}

function shakeSirius(){
  if(!p3Physics) return;
  const s=p3Physics.stars.find(st=>st.dist===9&&!st.isSiriusB);
  if(!s) return;
  const origX=s.x, origY=s.y;
  let t=0;
  (function vib(){
    t+=0.015; // 매우 느리게
    s.x=origX+Math.sin(t*8)*6*Math.max(0,1-t);
    drawScene();
    if(t<1) requestAnimationFrame(vib);
    else{ s.x=origX; drawScene(); }
  })();
}

let p4BRevealed=false;
let p4OrbitAngle=0, p4OrbitStarted=false, p4OrbitRafId=null, p4ZoomScale=1, _orbitParams=null, _orbitDir=1;

function revealSiriusB(){
  if(!p3Physics||p4BRevealed) return;
  p4BRevealed=true; window._p4BRev=true;
  const W=window.innerWidth, H=window.innerHeight;

  // 메시지
  const ui=document.getElementById('p4-ui');
  if(ui){ const q=ui.querySelector('div');
    if(q){ q.style.fontSize='13px';
           q.textContent='Sirius is a binary star system'; }}

  // 물음표 → 느낌표
  const qmark=document.getElementById('p4qmark');
  if(qmark){
    let ft=0;
    (function fo(){ ft+=0.08;
      qmark.setAttribute('opacity',String(Math.max(0,1-ft)));
      if(ft<1) requestAnimationFrame(fo);
      else{ qmark.textContent='!';
        let ft2=0;
        (function fi(){ ft2+=0.06;
          qmark.setAttribute('opacity',String(Math.min(1,ft2)));
          if(ft2<1) requestAnimationFrame(fi);
        })();
      }
    })();
  }

  // 박스 좌표
  const rect=document.getElementById('p4rect');
  if(!rect) return;
  const bx=parseFloat(rect.getAttribute('x'));
  const by=parseFloat(rect.getAttribute('y'));
  const bw=parseFloat(rect.getAttribute('width'));
  const cx=bx+bw/2, cy=by+bw/2;
  const orbitRx=bw*0.26, orbitRy=bw*0.09;

  // zoom=12 상태에서 시리우스 화면 크기
  const sAPhys=p3Physics.stars.find(st=>st.dist===9&&!st.isSiriusB);
  const rA=(sAPhys?sAPhys.r:3)*12;
  const rB=rA*0.35;
  const colA=sAPhys?sAPhys.col:'#e8f0ff';
  const ns='http://www.w3.org/2000/svg';
  const svg=document.getElementById('p4svg');
  if(!svg) return;

  // A 현재 위치 = 박스 중앙 (phase4 zoom 상태)
  const aX=cx, aY=cy;
  // B 목표: 궤도 오른쪽 끝
  const bTargetX=cx+orbitRx, bTargetY=cy;

  // p4svg에 직접 A,B 그리기 (oSvg/drawScene 대신)
  // 먼저 oSvg의 시리우스 숨기기
  if(sAPhys) sAPhys._fadeAlpha=0;
  if(p3Physics&&p3RecDone) drawScene();

  let t=0;
  (function emerge(){
    t+=0.01; if(t>1) t=1;
    const e=easeIO(t);

    // B 위치: A에서 목표로
    const bx2=aX+(bTargetX-aX)*e;
    const by2=aY+(bTargetY-aY)*e;
    // A 위치: 살짝 왼쪽으로
    const ax2=aX-(orbitRx*0.1)*e;
    const ay2=aY-(orbitRy*0.1)*e;

    // 기존 제거
    ['p4-emerge-a','p4-emerge-b','p4-emerge-ga','p4-emerge-gb'].forEach(id=>{
      const el=document.getElementById(id); if(el) el.remove();
    });

    const gwA=document.createElementNS(ns,'circle');
    gwA.id='p4-emerge-ga';gwA.setAttribute('cx',String(ax2));gwA.setAttribute('cy',String(ay2));
    gwA.setAttribute('r',String(rA*2.5));gwA.setAttribute('fill',colA+'18');svg.appendChild(gwA);
    const dA=document.createElementNS(ns,'circle');
    dA.id='p4-emerge-a';dA.setAttribute('cx',String(ax2));dA.setAttribute('cy',String(ay2));
    dA.setAttribute('r',String(rA));dA.setAttribute('fill',colA+'ee');svg.appendChild(dA);

    const gwB=document.createElementNS(ns,'circle');
    gwB.id='p4-emerge-gb';gwB.setAttribute('cx',String(bx2));gwB.setAttribute('cy',String(by2));
    gwB.setAttribute('r',String(rB*2.5));gwB.setAttribute('fill',colA+'18');svg.appendChild(gwB);
    const dB=document.createElementNS(ns,'circle');
    dB.id='p4-emerge-b';dB.setAttribute('cx',String(bx2));dB.setAttribute('cy',String(by2));
    dB.setAttribute('r',String(rB));dB.setAttribute('fill',colA+'ee');svg.appendChild(dB);

    if(t<1){ requestAnimationFrame(emerge); }
    else{
      // 안착 완료 → p4OrbitAngle=0 (B가 오른쪽)
      p4OrbitAngle=0;
      // emerge 별 제거는 startOrbit에서 처리
    }
  })();
}


function startOrbit(){
  if(p4OrbitRafId) return;
  p4OrbitStarted=true;

  const W=window.innerWidth, H=window.innerHeight;
  const zoom=12;
  const sAPhys=p3Physics?p3Physics.stars.find(st=>st.dist===9&&!st.isSiriusB):null;
  const sBPhys=p3Physics?p3Physics.stars.find(st=>st.isSiriusB):null;
  if(sAPhys) sAPhys._fadeAlpha=0;
  if(sBPhys) sBPhys._fadeAlpha=0;

  const rA=(sAPhys?sAPhys.r:3)*zoom;
  const rB=rA*0.35;
  const colA=sAPhys?sAPhys.col:'#e8f0ff';
  const ns='http://www.w3.org/2000/svg';

  const rect=document.getElementById('p4rect');
  if(!rect) return;
  const bx=parseFloat(rect.getAttribute('x'));
  const by=parseFloat(rect.getAttribute('y'));
  const bw=parseFloat(rect.getAttribute('width'));
  const cx=bx+bw/2, cy=by+bw/2;
  const orbitRx=bw*0.26, orbitRy=bw*0.09;

  // emerge 별 제거
  ['p4-emerge-a','p4-emerge-b','p4-emerge-ga','p4-emerge-gb'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.remove();
  });

  // 궤도 타원
  const svg=document.getElementById('p4svg');
  if(!svg) return;
  const _oe=document.getElementById('p4orbit'); if(_oe) _oe.remove();
  const ell=document.createElementNS(ns,'ellipse');
  ell.id='p4orbit';
  ell.setAttribute('cx',String(cx)); ell.setAttribute('cy',String(cy));
  ell.setAttribute('rx',String(orbitRx)); ell.setAttribute('ry',String(orbitRy));
  ell.setAttribute('fill','none');
  ell.setAttribute('stroke','rgba(240,242,245,0)');
  ell.setAttribute('stroke-width','1');
  svg.appendChild(ell);

  // 공전 모션(rAF) — 방향은 스크롤 방향(_orbitDir): 앞으로=정방향, 뒤로=역방향(역재생)
  let orbitSpeed=0, ellAlpha=0;
  (function loop(){
    orbitSpeed=Math.min(0.014,orbitSpeed+0.00008);
    p4OrbitAngle+=orbitSpeed*_orbitDir;
    ellAlpha=Math.min(0.25,ellAlpha+0.003);
    ell.setAttribute('stroke',`rgba(240,242,245,${ellAlpha})`);
    ['p4-oa','p4-ob','p4-gwa','p4-gwb'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove();});
    const ax=cx-Math.cos(p4OrbitAngle)*orbitRx*0.1;
    const ay=cy-Math.sin(p4OrbitAngle)*orbitRy*0.1;
    const bx2=cx+Math.cos(p4OrbitAngle)*orbitRx;
    const by2=cy+Math.sin(p4OrbitAngle)*orbitRy;
    const mk=(id,x,y,r,fill)=>{const c=document.createElementNS(ns,'circle');c.id=id;c.setAttribute('cx',String(x));c.setAttribute('cy',String(y));c.setAttribute('r',String(r));c.setAttribute('fill',fill);svg.appendChild(c);};
    mk('p4-gwa',ax,ay,rA*2.5,colA+'18');
    mk('p4-oa',ax,ay,rA,colA+'ee');
    mk('p4-gwb',bx2,by2,rB*2.5,colA+'18');
    mk('p4-ob',bx2,by2,rB,colA+'ee');
    p4OrbitRafId=requestAnimationFrame(loop);
  })();
}



function applyOrbit(t5){
  if(!p4BRevealed) return;
  const E=easeIO(Math.min(1,t5*0.6));

  // 박스 테두리, 버튼, 글자, 물음표 페이드아웃
  const fadeUI=Math.max(0,1-E*1.8);
  const p4ui=document.getElementById('p4-ui');
  if(p4ui) p4ui.style.opacity=String(fadeUI);
  const p4btns=document.getElementById('p4-btns');
  if(p4btns) p4btns.style.opacity=String(fadeUI);
  const p4rect2=document.getElementById('p4rect');
  if(p4rect2) p4rect2.setAttribute('stroke',`rgba(240,242,245,${0.55*fadeUI})`);
  // 물음표 페이드
  const qm=document.getElementById('p4qmark');
  if(qm) qm.setAttribute('opacity',String(fadeUI));

  // oSvg 그래프 페이드
  if(E<0.05) oSvg.style.transform='';
  oSvg.style.opacity=String(Math.max(0,1-E*4));

  // 공전 모션 (재)시작 — 역스크롤로 돌아와도 다시 시작
  if(E>0.1&&!p4OrbitRafId) startOrbit();
}




function applyZoomOut(t6){
  const W=window.innerWidth, H=window.innerHeight;
  const E=easeIO(Math.min(1,t6*0.5));

  const {s:baseS,ox,oy}=getSVGScaleAndOffset();
  const sirSX=SIRIUS_CX*baseS+ox;
  const DIST_MIN=9,DIST_MAX=3200;
  const ratio=(Math.log(9)-Math.log(DIST_MIN))/(Math.log(DIST_MAX)-Math.log(DIST_MIN));
  const sirGraphY=H*0.85-ratio*H*0.75;

  // p4svg: 화면 중앙 → 시리우스 그래프 위치로 이동+축소
  // 줌아웃 끝 별 크기를 그래프1 하늘 시리우스(svgR×baseS=drawR)에 맞춤 → 화면배율 무관 매끄럽게
  // 궤도 시리우스 반지름 rA = sAPhys.r(3)*12 = 36 (고정). 최종 화면크기 = 36*minSc 가 drawR 이 되도록.
  const _sA=p3Physics?p3Physics.stars.find(st=>st.dist===9&&!st.isSiriusB):null;
  const _sirDrawR=_sA?(_sA.drawR||(_sA.r*baseS)):(8.2*baseS);
  const minSc=Math.min(1,Math.max(1/12,_sirDrawR/36));
  const sc=Math.max(minSc,1-E*(1-minSc));
  const p4s=document.getElementById('p4svg');
  if(p4s){
    p4s.style.transformOrigin=`${W/2}px ${H/2}px`;
    p4s.style.transform=`translate(${(sirSX-W/2)*E}px,${(sirGraphY-H/2)*E}px) scale(${sc})`;
    p4s.style.opacity='1';
    p4s.style.display='';
  }

  // sky-svg: 별 위치를 그래프1로 직접 설정 (applyPhase2 사용 안함)
  // p4svg와 동일한 시리우스 위치 기준으로 줌아웃
  const svgEl=document.getElementById('sky-svg');
  if(svgEl){
    svgEl.style.display='';
    // 별 cy를 그래프1 위치로 직접 이동
    function distToScreenY(d){
      const r2=(Math.log(d)-Math.log(DIST_MIN))/(Math.log(DIST_MAX)-Math.log(DIST_MIN));
      return H*0.85-r2*H*0.75;
    }
    document.querySelectorAll('.constellation').forEach(g=>{
      const cid=g.dataset.id;
      const distData=STAR_DIST_MAP[cid]||{};
      g.querySelectorAll('.const-star').forEach(circ=>{
        const origCy=parseFloat(circ.dataset.baseOrigCy||circ.dataset.origCy||circ.getAttribute('cy'));
        const origCx=parseFloat(circ.getAttribute('cx'));
        const dist=distData[origCx.toFixed(1)]||500;
        const targetScreenY=distToScreenY(dist);
        const origScreenY=origCy*baseS+oy;
        const deltaSVG=(targetScreenY-origScreenY)/baseS;
        circ.setAttribute('cy',String(origCy+deltaSVG));
        // 시리우스(canis-major, dist=9)는 숨김 - p4svg에서 표시
        // sc가 충분히 작아지면 서서히 복원
        if(cid==='canis-major'&&dist===9){
          const sirAlpha=Math.max(0,(1/60+0.01-sc)/(1/60));
          circ.style.opacity=String(Math.min(1,sirAlpha));
        }
      });
    });
    // 연결선 숨김
    document.querySelectorAll('.const-line,.const-label').forEach(el=>{el.style.opacity='0';});

    // sky-svg를 시리우스 위치 기준 줌아웃 (p4svg와 동일 origin)
    const zoom=1+11*(1-E); // 12→1
    svgEl.style.transformOrigin=`${sirSX}px ${sirGraphY}px`;
    svgEl.style.transform=`scale(${zoom})`;
    svgEl.style.opacity=String(E*E); // E² 로 처음엔 거의 안보임

    // Y축 oSvg
    oSvg.innerHTML=''; oSvg.style.transform='';
    oSvg.style.opacity=String(E*E);
  }

  if(E>=1){
    if(svgEl){ svgEl.style.transform=''; svgEl.style.transformOrigin=''; svgEl.style.opacity='1'; }
    // 시리우스 복원
    document.querySelectorAll('#const-canis-major .const-star').forEach(circ=>{
      circ.style.opacity='1';
    });
    oSvg.style.opacity='1'; oSvg.style.transform='';
    ['p4-ui','p4-btns','p4svg','p4-hit'].forEach(id=>{
      const e2=document.getElementById(id); if(e2) e2.style.display='none';
    });
    _orbitParams=null;
    if(p4OrbitRafId){ cancelAnimationFrame(p4OrbitRafId); p4OrbitRafId=null; }
  }
}














function applyPhase4(t4, doRender){
  const W=window.innerWidth,H=window.innerHeight;
  p4E=easeIO(Math.min(1,t4));

  const maxWY=p3Physics?Math.max(0,p3Physics.hBase+p3Physics.SLOT+14-(H*0.88+P3_AXIS_DOWN)):0;
  const siriusStar=p3Physics?p3Physics.stars.find(s=>s.dist===9&&!s.isSiriusB):null;
  const sx=siriusStar?siriusStar.x:W*0.1;
  const sy=siriusStar?siriusStar.y-maxWY:H*0.5;
  const sr=siriusStar?siriusStar.r:3;

  const zoom=1+p4E*11;
  const offX=(W/2-sx)*p4E;
  const offY=(H/2-sy)*p4E;
  oSvg.style.transformOrigin=`${sx}px ${sy}px`;
  oSvg.style.transform=`translate(${offX}px,${offY}px) scale(${zoom})`;
  oSvg.style.opacity='1';

  if(p4E>=0.98){
    const uiEl=document.getElementById('p4-ui');
    if(uiEl) uiEl.style.opacity='1';
    else buildP4UI(W/2,H/2,sr*zoom);
    const btnsEl=document.getElementById('p4-btns');
    if(btnsEl) btnsEl.style.opacity='1';
  } else {
    const uiEl=document.getElementById('p4-ui');
    if(uiEl) uiEl.style.opacity=String(Math.max(0,(p4E-0.97)*33));
    const btnsEl=document.getElementById('p4-btns');
    if(btnsEl) btnsEl.style.opacity=String(Math.max(0,(p4E-0.97)*33));
  }
  // 박스(p4svg) 전체를 줌(p4E)에 연동해 페이드 → 역스크롤로 줌아웃하면 박스도 같이 사라져 그래프2와 안 겹침
  const _p4box=document.getElementById('p4svg');
  if(_p4box) _p4box.style.opacity=String(Math.max(0,Math.min(1,(p4E-0.7)/0.28)));
  if(doRender && p3Physics && p3RecDone) drawScene();
}
// 시리우스(phase4) 정리 — 역스크롤로 phase3 복귀 시 박스/줌/상태 제거
function resetPhase4(){
  p4E=0; p4Built=false; p4Done=false; p4BRevealed=false; p4Wrong=0; window._p4BRev=false;
  p4OrbitStarted=false; _orbitParams=null; if(p4OrbitRafId){cancelAnimationFrame(p4OrbitRafId);p4OrbitRafId=null;}
  if(p3Physics) p3Physics.stars.forEach(s=>{ if(s._fadeAlpha!==undefined) delete s._fadeAlpha; });
  oSvg.style.transform=''; oSvg.style.transformOrigin=''; oSvg.style.opacity='1';
  ['p4-ui','p4-btns','p4svg','p4-hit'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove();});
}

// ── Phase: 그래프1→별자리→영역 (위치 기반 Finale 모듈로 재작성) ──
window.STAR_DIST_MAP = STAR_DIST_MAP;
window.Finale = (function(){
  const DIST_MIN=9, DIST_MAX=3200, MORPH_N=240, LINE_W=0.8;
  const RET_END=0.85, DRAW_END=1.15;   // tR 밴드 경계
  const DD=0.16;                        // 선 1개가 그려지는 데 드는 정규화 진행 폭
  function scaleOff(){const W=innerWidth,H=innerHeight,s=Math.min(W/1960,H/980);
    return {s,ox:(W-1960*s)/2,oy:(H-980*s)/2,W,H};}
  function distToScreenY(d,H){const r=(Math.log(d)-Math.log(DIST_MIN))/(Math.log(DIST_MAX)-Math.log(DIST_MIN));
    return H*0.85-r*H*0.75;}
  const easeIO=t=>t<0.5?2*t*t:-1+(4-2*t)*t;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  document.querySelectorAll('.const-star').forEach(c=>{
    if(c.dataset.baseOrigCy==null) c.dataset.baseOrigCy=c.getAttribute('cy');});

  const parsePts=s=>(s||'').trim().split(/\s+/).filter(Boolean).map(p=>{const a=p.split(',').map(Number);return [a[0],a[1]];});
  function arclen(p,closed){let L=0;for(let i=0;i<p.length-1;i++)L+=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);
    if(closed&&p.length>1)L+=Math.hypot(p[0][0]-p[p.length-1][0],p[0][1]-p[p.length-1][1]);return L;}
  function resample(pts,M,closed){
    const P=pts.map(p=>[p[0],p[1]]); if(closed&&P.length>1)P.push([P[0][0],P[0][1]]);
    const seg=[],cum=[0];let tot=0;
    for(let i=0;i<P.length-1;i++){const d=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);seg.push(d);tot+=d;cum.push(tot);}
    if(tot<1e-6)return Array.from({length:M},()=>[P[0][0],P[0][1]]);
    const out=[],denom=closed?M:(M-1);
    for(let i=0;i<M;i++){const target=tot*(i/denom);let s=0;while(s<seg.length-1&&cum[s+1]<target)s++;
      const f=(target-cum[s])/(seg[s]||1e-6);
      out.push([P[s][0]+(P[s+1][0]-P[s][0])*f,P[s][1]+(P[s+1][1]-P[s][1])*f]);}
    return out;}
  function chainLines(segs){
    if(!segs.length)return [];
    const rem=segs.map(s=>s.slice());let chain=rem.shift().slice();
    while(rem.length){
      const end=chain[chain.length-1];let bi=0,brev=false,bd=Infinity;
      rem.forEach((seg,idx)=>{const ds=(seg[0][0]-end[0])**2+(seg[0][1]-end[1])**2;
        const de=(seg[seg.length-1][0]-end[0])**2+(seg[seg.length-1][1]-end[1])**2;
        if(ds<bd){bd=ds;bi=idx;brev=false;} if(de<bd){bd=de;bi=idx;brev=true;}});
      let seg=rem.splice(bi,1)[0]; if(brev)seg=seg.slice().reverse(); chain=chain.concat(seg);}
    return chain;}

  const _bcache={};
  function boundaryPoints(cid,M){
    if(_bcache[cid])return _bcache[cid];
    const g=document.getElementById('area-'+cid); if(!g)return null;
    const m=(g.getAttribute('transform')||'').match(/translate\(([^,]+),([^)]+)\)\s*scale\(([^)]+)\)/);
    const tx=m?+m[1]:0,ty=m?+m[2]:0,sc=m?+m[3]:1;
    const sh=g.querySelector('path,polygon'); if(!sh)return null;
    let pts=[];
    try{const tl=sh.getTotalLength();for(let i=0;i<M;i++){const pt=sh.getPointAtLength(tl*i/M);pts.push([tx+pt.x*sc,ty+pt.y*sc]);}}
    catch(e){const raw=parsePts(sh.getAttribute('points')).map(p=>[tx+p[0]*sc,ty+p[1]*sc]);pts=resample(raw,M,true);}
    _bcache[cid]=pts;return pts;}
  function alignClosed(A,B,M){
    let best=B,bestS=Infinity;
    [B,[...B].reverse()].forEach(dir=>{for(let r=0;r<M;r+=2){let s=0;
      for(let i=0;i<M;i++){const j=(i+r)%M;const dx=dir[j][0]-A[i][0],dy=dir[j][1]-A[i][1];s+=dx*dx+dy*dy;}
      if(s<bestS){bestS=s;best=dir.slice(r).concat(dir.slice(0,r));}}});
    return best;}
  const _plan={};
  function buildPlan(g){
    const cid=g.dataset.id; if(_plan[cid])return _plan[cid];
    const B0=boundaryPoints(cid,MORPH_N); if(!B0)return null;
    const segs=[...g.querySelectorAll('.const-line')].map(el=>parsePts(el.getAttribute('points'))).filter(p=>p.length>=2);
    if(!segs.length)return null;
    const A=resample(chainLines(segs),MORPH_N,true);
    _plan[cid]={src:A,dst:alignClosed(A,B0,MORPH_N)};
    return _plan[cid];}

  // ── 선 그리기 시작순서 분포 (한 번만 계산) ──
  // 별 공유 그래프 → 컴포넌트 → 컴포넌트별 가속 합류 + 내부 BFS 깊이로 전파감
  let _sched=null;
  function buildSchedule(){
    const L=[...document.querySelectorAll('.const-line')].map(el=>{
      const pts=parsePts(el.getAttribute('points'));
      return {el,pts,len:arclen(pts,false),a:pts[0],b:pts[pts.length-1],adj:new Set()};
    }).filter(o=>o.len>0&&o.pts.length>=2);
    const key=p=>Math.round(p[0]/6)+'_'+Math.round(p[1]/6);
    const byStar={};
    L.forEach(l=>{[l.a,l.b].forEach(p=>{(byStar[key(p)]=byStar[key(p)]||[]).push(l);});});
    Object.values(byStar).forEach(arr=>arr.forEach(a=>arr.forEach(b=>{if(a!==b)a.adj.add(b);})));
    // 컴포넌트 + BFS 깊이
    const seen=new Set(),comps=[];
    L.forEach(l=>{if(seen.has(l))return;const comp=[],q=[l];seen.add(l);l.depth=0;
      while(q.length){const c=q.shift();comp.push(c);c.adj.forEach(n=>{if(!seen.has(n)){seen.add(n);n.depth=c.depth+1;q.push(n);}});}
      comps.push(comp);});
    for(let i=comps.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[comps[i],comps[j]]=[comps[j],comps[i]];}
    const nC=comps.length;let acc=0;
    comps.forEach((comp,k)=>{
      comp.forEach(l=>{l.sRaw=acc + l.depth*0.65 + Math.random()*0.3;});
      acc += (1 - k/nC)*1.4 + 0.15;        // 초반 컴포넌트는 띄엄띄엄, 후반엔 촘촘히 합류
    });
    let mx=0; L.forEach(l=>{mx=Math.max(mx,l.sRaw);});
    L.forEach(l=>{l.s = mx>0 ? l.sRaw/mx : 0;});
    _sched=L; return L;
  }
  function hideLines(){(_sched||document.querySelectorAll('.const-line')).forEach(o=>{const el=o.el||o;
    el.style.transition='none';el.style.strokeDasharray='';el.style.strokeDashoffset='';el.style.opacity='0';});}
  function applyLineDraw(drawP){
    const L=_sched||buildSchedule();
    L.forEach(l=>{
      const s0=l.s*(1-DD);
      const f=clamp((drawP-s0)/DD,0,1);
      l.el.style.transition='none';
      if(f<=0){l.el.style.opacity='0';l.el.style.strokeDasharray=String(l.len);l.el.style.strokeDashoffset=String(l.len);return;}
      l.el.style.strokeDasharray=String(l.len);
      l.el.style.strokeDashoffset=String(l.len*(1-f));
      l.el.style.opacity='0.5';
    });
  }
  function reset(){_sched=null; setInk(0);
    document.querySelectorAll('.const-line').forEach(el=>{el.style.transition='none';el.style.strokeDasharray='';el.style.strokeDashoffset='';el.style.opacity='0';});
    document.querySelectorAll('[id^="morph-"]').forEach(m=>m.remove());
    document.querySelectorAll('.const-area').forEach(a=>a.setAttribute('opacity','0'));}

  function apply(tR){
    const {s:baseS,oy,H}=scaleOff();
    const returnP=easeIO(clamp(tR/RET_END,0,1));
    const graphE=1-returnP;
    const drawP=clamp((tR-RET_END)/(DRAW_END-RET_END),0,1);
    const areaE=easeIO(clamp((tR-DRAW_END)/(2-DRAW_END),0,1));
    ensureInkFilter();
    const inkE=easeIO(clamp((areaE-0.2)/0.65,0,1));   // 영역으로 모핑되며 잉크 챕터로 전환
    setInk(inkE);
    const sky=document.getElementById('sky-svg');
    if(sky){sky.style.display='';sky.style.opacity='1';sky.style.transform='';}

    // 별 위치
    document.querySelectorAll('.constellation').forEach(g=>{
      g.style.opacity='1';
      const dm=window.STAR_DIST_MAP[g.dataset.id]||{};
      g.querySelectorAll('.const-star').forEach(c=>{
        const oc=+c.dataset.baseOrigCy,ox2=+c.getAttribute('cx');

        if(_lightE!==null){
          // 빛 모션: 모두 같은(두꺼운) 굵기로 출발 → 출발 후 '경과 시간'에 비례해 균일 속도로 가늘어짐.
          // 돌림노래식: 먼저 떠난 먼 별일수록 더 오래 지나 더 가늘어짐. 그 별의 정적 굵기에서 멈춤(가까운 별이 더 굵게 남음).
          const lc=vividColor(s.col);
          const recency=1-ratio;
          const swStatic = ink>0.001 ? Math.max(0.5, swBase*(0.30+Math.pow(recency,1.25)*0.8)) : swBase;
          const swStart = swStartCommon*1.15;               // 다같이 같은 굵기로 출발(가장 두꺼운 정적보다 조금 더)
          const elapsed = Math.max(0, _lightE - departT);   // 출발 후 경과 시간(초)
          const RATE = swStart / LIGHT_T;                   // 균일한 얇아짐 속도(초당)
          const sw = Math.max(swStatic, swStart - RATE*elapsed);   // 경과시간만큼 얇아지되 정적 굵기에서 멈춤
          ctx.beginPath();ctx.moveTo(x-sw,barBottom);ctx.lineTo(x-sw,topY);ctx.lineTo(x+sw,topY);ctx.lineTo(x+sw,barBottom);ctx.closePath();
          ctx.fillStyle=lc; ctx.globalAlpha=a0*0.6;   // 투명도(이쁘게)
          ctx.fill(); ctx.globalAlpha=1;
        } else {
          const recency=1-ratio;   // 1=최근(가까운 빛), 0=오래된(먼 빛)
          if(ink>0.001){
            const sw=Math.max(0.5, swBase*(0.30+Math.pow(recency,1.25)*0.8));
            const barA=a0*(0.14+recency*0.78);
            ctx.beginPath();ctx.moveTo(x-sw,barBottom);ctx.lineTo(x-sw,topY);ctx.lineTo(x+sw,topY);ctx.lineTo(x+sw,barBottom);ctx.closePath();
            const g=ctx.createLinearGradient(0,barBottom,0,topY);
            g.addColorStop(0, lerpHex(scol, '#ececec', 0.72));
            g.addColorStop(1, scol);
            ctx.fillStyle=g; ctx.globalAlpha=barA;
            ctx.fill(); ctx.globalAlpha=1;
          } else {
            const sw=swBase;
            ctx.globalAlpha=a0;
            ctx.beginPath();ctx.moveTo(x-sw,barBottom);ctx.lineTo(x-sw,topY);ctx.lineTo(x+sw,topY);ctx.lineTo(x+sw,barBottom);ctx.closePath();
            const g=ctx.createLinearGradient(0,barBottom,0,topY);
            g.addColorStop(0,s.col+'12');g.addColorStop(1,s.col+'cc');ctx.fillStyle=g;
            ctx.fill(); ctx.globalAlpha=1;
          }
        }
      }
      // 별 크기: 첫 화면 별 반지름(광도)에 비례 (sr * 화면스케일 * 줌)
      const baseR=Math.max(1.6,(s.sr||2.5)*S*zoom);
      const r=baseR*(isHover?1.4:1);
      if(isHover){
        if(ink>0.5){
          // 잉크: 밝은 배경 → 글로우 대신 진한 점 + 가는 먹 테두리
          ctx.globalAlpha=1;ctx.fillStyle=scol;ctx.beginPath();ctx.arc(x,topY,r,0,6.3);ctx.fill();
          ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,topY,r+2,0,6.3);ctx.stroke();
        } else {
          // 어두운 우주: 글로우 + 코어
          const gg=ctx.createRadialGradient(x,topY,0,x,topY,r*3.6);
          gg.addColorStop(0,s.col);gg.addColorStop(.35,s.col+'b0');gg.addColorStop(1,'transparent');
          ctx.globalAlpha=1;ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,topY,r*3.6,0,6.3);ctx.fill();
          ctx.fillStyle=s.col;ctx.beginPath();ctx.arc(x,topY,r,0,6.3);ctx.fill();
        }
      } else {
        ctx.globalAlpha=dim?0.16:1;
        ctx.fillStyle=scol;ctx.beginPath();ctx.arc(x,topY,r,0,6.3);ctx.fill();
      }
      ctx.globalAlpha=1;
      _hits.push({i,x,y:topY});
    }
    // 호버 라벨 (별자리 이름 + 거리)
    if(hoverIdx>=0){
      const s=STARS[hoverIdx], c=floor(s.cx,s.cy), bh=barWorld(s.dist,p)*S*zoom;
      const tx=c.sx+12, ty=c.sy-bh-10;
      ctx.textAlign='left';
      const nameCol = inkLevel>0.5 ? '#262626' : 'rgba(240,242,245,0.97)';
      const distCol = inkLevel>0.5 ? lerpHex((G1_TEXT_COLOR&&G1_TEXT_COLOR[s.cid])||s.col, '#3a3a3a', 0.55) : ((G1_TEXT_COLOR&&G1_TEXT_COLOR[s.cid])||s.col);
      ctx.font='600 13px "Noto Sans KR",sans-serif';ctx.fillStyle=nameCol;ctx.fillText(s.kr,tx,ty);
      ctx.font='12px Montserrat, sans-serif';ctx.fillStyle=distCol;ctx.fillText(s.dist+' ly',tx,ty+15);
      // 빛이 떠난 연도 (지금 보는 빛은 dist년 전 과거) — 현재 연도 기준으로 매년 자동 갱신
      const yr=(new Date().getFullYear())-Math.round(s.dist);
      const yrTxt=(yr>0?(yr+'년'):('기원전 '+(1-yr)+'년'))+'에 떠난 빛';
      ctx.font='600 11px "Noto Sans KR",sans-serif';
      ctx.fillStyle = inkLevel>0.5 ? '#6b5a3e' : 'rgba(232,185,97,0.95)';   // 세피아/금빛 = 옛 빛
      ctx.fillText(yrTxt,tx,ty+31);
    }
  }
  function hoverAt(mx,my){
    let best=-1, bd=20*20;
    for(const h of _hits){ const dx=h.x-mx,dy=h.y-my,d=dx*dx+dy*dy; if(d<bd){bd=d;best=h.i;} }
    if(best!==hoverIdx){ hoverIdx=best; draw(curP); }
  }
  function redraw(){ if(active) draw(curP); }
  function activate(){ init(); if(active)return; active=true; canvas.style.display='block';
    const a=document.getElementById('area-svg'), s=document.getElementById('sky-svg');
    if(a)a.style.opacity='0'; if(s)s.style.display='none';
    const z=document.getElementById('bld-zoom'); if(z)z.style.display='flex';
    if(window.__bldSyncZoom) window.__bldSyncZoom(); }
  function deactivate(){ if(!active)return; stopLight(); active=false; if(canvas)canvas.style.display='none';
    const a=document.getElementById('area-svg'), s=document.getElementById('sky-svg');
    if(a)a.style.opacity=''; if(s)s.style.display='';
    const z=document.getElementById('bld-zoom'); if(z)z.style.display='none'; }
  function lightLoop(){
    if(lightStart===null){ lightRaf=null; return; }
    redraw();
    if((performance.now()-lightStart)/1000 > LIGHT_T+LIGHT_PAUSE) lightStart=performance.now();
    lightRaf=requestAnimationFrame(lightLoop);
  }
  function playLight(){ if(!active)return; lightStart=performance.now(); if(!lightRaf) lightRaf=requestAnimationFrame(lightLoop); }
  function stopLight(){ lightStart=null; if(lightRaf){cancelAnimationFrame(lightRaf);lightRaf=null;} const _cl=document.getElementById('cap-light'); if(_cl) _cl.style.opacity='0'; if(active)redraw(); }
  return {
    apply(p){ activate(); draw(Math.max(0,Math.min(1,p))); },
    playLight, stopLight, toggleLight(){ if(lightStart!==null) stopLight(); else playLight(); }, lightPlaying:()=>lightStart!==null,
    deactivate, isActive:()=>active,
    rotate(dx){ yaw-=dx; redraw(); },
    tilt(dy){ pitch=Math.max(0.45, Math.min(Math.PI/2, pitch - dy)); redraw(); },
    pan(dx,dy){ panX+=dx; panY+=dy; redraw(); },
    zoomBy(f){ const nz=Math.max(0.3,Math.min(5,zoom*f)); const k=nz/zoom; panX*=k; panY*=k; zoom=nz; redraw(); },
    getZoom:()=>zoom,
    setZoom(z){ const nz=Math.max(0.3,Math.min(5,z)); const k=nz/zoom; panX*=k; panY*=k; zoom=nz; redraw(); },
    home(){ yaw=0; pitch=Math.PI/2; zoom=1; panX=0; panY=0; redraw(); },
    hover(mx,my){ if(active) hoverAt(mx,my); }
  };
})();

// ── 메인 스크롤(피날레까지) + 빌딩뷰 조작 ──
let _bldDrag=false, _bldRot=false, _bldPX=0, _bldPY=0, bldP=0;
window.addEventListener('wheel', e => {
  if(Building.isActive()){
    e.preventDefault();
    if(e.ctrlKey){ Building.zoomBy(1 - e.deltaY*0.01); return; }                 // 맥 핀치 = 줌
    if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){ Building.rotate(e.deltaX*0.004); return; } // 가로 = 회전
    if(bldLocked){ Building.zoomBy(1 - e.deltaY*0.0026); return; }                // 빌딩뷰: 세로휠 = 확대/축소
    scrollTarget = Math.max(0, Math.min(12, scrollTarget + e.deltaY * 0.0012));   // 상승 중: 세로 = 빌딩 상승/하강
    if(!scrollAnimId) loopScroll(); return;
  }
  e.preventDefault();
  scrollTarget = Math.max(0, Math.min(12, scrollTarget + e.deltaY * 0.0012));
  if(!scrollAnimId) loopScroll();
}, {passive: false});
window.addEventListener('mousedown', e=>{ if(Building.isActive()){ _bldDrag=true; _bldRot=(e.button===2||e.shiftKey); _bldPX=e.clientX; _bldPY=e.clientY; const cv=document.getElementById('bld-canvas'); if(cv)cv.style.cursor='grabbing'; } });
window.addEventListener('mouseup', ()=>{ _bldDrag=false; _bldRot=false; const cv=document.getElementById('bld-canvas'); if(cv)cv.style.cursor='grab'; });
window.addEventListener('contextmenu', e=>{ if(Building.isActive()) e.preventDefault(); });  // 우드래그 회전용
window.addEventListener('mousemove', e=>{
  if(_bldDrag && Building.isActive()){
    const dx=e.clientX-_bldPX, dy=e.clientY-_bldPY;
    if(_bldRot){ Building.rotate(dx*-0.006); Building.tilt(dy*-0.006); }  // 우/Shift = 회전+틸트
    else { Building.pan(dx,dy); }                                         // 좌 = 이동(팬)
    _bldPX=e.clientX; _bldPY=e.clientY;
  }
  else if(Building.isActive()){ Building.hover(e.clientX, e.clientY); }
});
window.addEventListener('touchstart', e=>{ if(Building.isActive()){ _bldDrag=true; _bldRot=(e.touches.length>=2); _bldPX=e.touches[0].clientX; _bldPY=e.touches[0].clientY; } }, {passive:true});
window.addEventListener('touchmove', e=>{ if(_bldDrag && Building.isActive()){ const t=e.touches[0]; const dx=t.clientX-_bldPX, dy=t.clientY-_bldPY;
    if(_bldRot){ Building.rotate(dx*-0.006); Building.tilt(dy*-0.006); } else { Building.pan(dx,dy); }
    _bldPX=t.clientX; _bldPY=t.clientY; } }, {passive:true});
window.addEventListener('touchend', ()=>{ _bldDrag=false; _bldRot=false; });
window.addEventListener('keydown', e=>{ if(!Building.isActive())return;
  if(e.key==='+'||e.key==='=') Building.zoomBy(1.12);
  if(e.key==='-'||e.key==='_') Building.zoomBy(1/1.12); });
window.addEventListener('dblclick', ()=>{ if(Building.isActive()) Building.home(); });

// 홈 버튼: 빌딩뷰 → 평면 영역뷰로 빠져나감(역상승 애니메이션). 이후 스크롤=다시 상승, 역스크롤=이전 정보 역재생
function exitBuildingToRegions(){
  bldLocked=false;
  scrollTarget=11;            // 영역뷰(평면) 지점으로 부드럽게 하강
  if(!scrollAnimId) loopScroll();
}

// 빌딩뷰 줌 컨트롤(화면 버튼) — 막대가 화면 밖으로 솟을 때 축소해서 볼 수 있게
(function(){
  const wrap=document.createElement('div'); wrap.id='bld-zoom';

  const mkBtn=(txt,title)=>{
    const b=document.createElement('button'); b.textContent=txt; b.title=title;

      +'background:rgba(16,22,42,.92);border:1px solid rgba(232,185,97,.45);color:#e8b961;'

  };
  const bHome=document.createElement('button'); bHome.title='평면 영역뷰로 나가기';
  applyBackBtn(bHome,46);
  const bTime=document.createElement('button'); bTime.title='빛 도착 모션 재생/정지';
  applyTimeBtn(bTime,46);
  function syncSlider(){}   // 슬라이더 제거됨(휠로 줌) — 호환용 no-op
  [bTime,bHome].forEach(b=>wrap.appendChild(b));
  document.body.appendChild(wrap);
  window.__bldSyncZoom=syncSlider;
  const stop=e=>{e.preventDefault();e.stopPropagation();};
  function bind(btn,fn){
    btn.addEventListener('click',e=>{stop(e);fn();});
    btn.addEventListener('wheel',stop,{passive:false});
    btn.addEventListener('touchstart',e=>{stop(e);fn();},{passive:false});
  }
  bind(bHome,()=>exitBuildingToRegions());
  bind(bTime,()=>{ Building.toggleLight(); const _cl=document.getElementById('cap-light'); if(_cl) _cl.style.opacity=Building.lightPlaying()?'1':'0'; bTime.style.filter = Building.lightPlaying()? 'drop-shadow(0 0 9px rgba(133,155,173,.95))' : 'drop-shadow(0 2px 8px rgba(0,0,0,.4))'; });
})();

function updateBld2(){
  if(bldP>0.001){ Building.apply(bldP); } else { Building.deactivate(); }
  if(window.__bldPlace) window.__bldPlace();
}
// 빌딩뷰 전용 컨트롤(오른쪽 아래)
(function(){
  const wrap=document.createElement('div'); wrap.id='bld-control';
  wrap.style.cssText='position:fixed;right:26px;bottom:26px;z-index:90;width:56px;height:178px;border-radius:28px;'
    +'background:rgba(16,22,42,.92);border:1px solid rgba(232,185,97,.4);'
    +'flex-direction:column;align-items:center;padding:12px 0;cursor:ns-resize;'
    +'display:none;font-family:Montserrat,sans-serif;user-select:none;';
  wrap.innerHTML='<div style="color:#e8b961;font-size:15px;pointer-events:none">↑</div>'
    +'<div id="bld-track" style="flex:1;width:6px;margin:8px 0;border-radius:3px;background:rgba(255,255,255,.12);position:relative;pointer-events:none">'
    +'<div id="bld-handle" style="position:absolute;left:50%;bottom:0;width:18px;height:18px;margin-left:-9px;margin-bottom:-9px;border-radius:50%;background:#e8b961;box-shadow:0 0 10px rgba(232,185,97,.8);pointer-events:none"></div></div>'
    +'<div style="color:#9aa0b8;font-size:8px;letter-spacing:.14em;writing-mode:vertical-rl;transform:rotate(180deg);pointer-events:none">거리 빌딩뷰</div>';
  document.body.appendChild(wrap);
  const handle=wrap.querySelector('#bld-handle'), track=wrap.querySelector('#bld-track');
  window.__bldPlace=function(){ handle.style.bottom=(bldP*100)+'%'; };
  function setP(v){ bldP=Math.max(0,Math.min(1,v)); updateBld2(); }
  function fromY(cy){ const r=track.getBoundingClientRect(); return (r.bottom-cy)/r.height; }
  wrap.addEventListener('wheel',e=>{ e.preventDefault(); e.stopPropagation(); setP(bldP - e.deltaY*0.0016); },{passive:false});
  let drag=false;
  wrap.addEventListener('mousedown',e=>{ drag=true; setP(fromY(e.clientY)); e.stopPropagation(); });
  window.addEventListener('mousemove',e=>{ if(drag) setP(fromY(e.clientY)); });
  window.addEventListener('mouseup',()=>{ drag=false; });
  wrap.addEventListener('touchstart',e=>{ drag=true; setP(fromY(e.touches[0].clientY)); e.stopPropagation(); },{passive:true});
  wrap.addEventListener('touchmove',e=>{ if(drag) setP(fromY(e.touches[0].clientY)); },{passive:true});
  wrap.addEventListener('touchend',()=>{ drag=false; });
})();
// 빌딩뷰는 스크롤로 진입 — 슬라이더 컨트롤 미사용(숨김)
